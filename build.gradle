plugins {
    // 26.x = mojmap ohne Remap -> neues Loom-Plugin
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Simple Voice Chat API (nur zum Kompilieren, die Mod selbst muss im mods-Ordner liegen)
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    // Offline-Spracherkennung (Vosk) + JNA, in die Mod-Jar eingebettet
    implementation "com.alphacephei:vosk:${project.vosk_version}"
    implementation "net.java.dev.jna:jna:${project.jna_version}"
    include "com.alphacephei:vosk:${project.vosk_version}"
    include "net.java.dev.jna:jna:${project.jna_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
